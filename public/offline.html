<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7774db" />
    <title>You're offline · Noteflow</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font:
          16px/1.65 system-ui,
          sans-serif;
        background: #fafafb;
        color: #292a35;
      }
      main {
        max-width: 440px;
      }
      .brand {
        font-size: 21px;
        font-weight: 750;
        color: #615dc9;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
        margin: 32px 0 16px;
        letter-spacing: -0.025em;
      }
      p {
        margin: 0 0 16px;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 20px;
        background: #615dc9;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid #7774db;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">noteflow.</div>
      <h1>Let's reconnect.</h1>
      <p>Noteflow needs an internet connection to open your library and create study materials.</p>
      <p>
        Notes already saved to your account will be available when you're back online. Private notes
        aren't stored in this offline screen.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
